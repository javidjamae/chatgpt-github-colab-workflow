name: Test notebook and experiment
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Register Python 3 kernel
        run: python -m ipykernel install --user --name python3 --display-name 'Python 3'
      - run: python -m pytest -q
      - name: Execute notebook from clean kernel
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          path = "notebooks/signup_experiment.ipynb"
          nb = nbformat.read(path, as_version=4)
          NotebookClient(nb, timeout=180, kernel_name="python3", resources={"metadata":{"path":"."}}).execute()
          print("Notebook executed successfully:", path)
          PY
